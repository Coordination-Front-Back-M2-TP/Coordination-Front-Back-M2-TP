# Le back est joignable sous le nom « back » dans le réseau Docker (deploy/compose.yml).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://back:3000;
    proxy_http_version 1.1;
    # Le temps réel passe par WebSocket : il faut transmettre la demande de changement de protocole.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 1h;
  }

  # Application monopage : toute route inconnue renvoie index.html, React s'occupe du reste.
  location / {
    try_files $uri /index.html;
  }
}
