name: Qualité de la documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Vérifier le format des fichiers Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md" "!node_modules" "!.github/pull_request_template.md"

  liens:
    name: Liens cassés (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier les liens des fichiers Markdown
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --verbose --no-progress './**/*.md'
          fail: true
