name: Relecture

# Le job « Relecture approuvée » échoue tant qu'une PR attend une approbation de l'équipe
# ou qu'un membre demande des modifications. Il lit seulement les avis et les droits.
# Le dépôt privé du plan gratuit n'a pas de règle de branche : l'équipe respecte ce contrôle avant le merge.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  pull-requests: read

concurrency:
  group: relecture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  statut:
    name: Relecture approuvée
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les avis de l'équipe
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // L'équipe, ce sont les personnes qui ont le droit d'écriture. Le prof, invité en lecture, n'en fait pas partie.
            const droits = new Map();
            async function dansLEquipe(login) {
              if (!droits.has(login)) {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: login,
                });
                droits.set(login, ['admin', 'maintain', 'write'].includes(data.permission));
              }
              return droits.get(login);
            }

            // Dernier avis de chaque relecteur. Un simple commentaire ne change pas son avis.
            const avis = new Map();
            for (const review of reviews) {
              if (!review.user || review.user.type === 'Bot' || review.user.login === pr.user.login) continue;
              if (review.state === 'COMMENTED' || review.state === 'PENDING') continue;
              if (!(await dansLEquipe(review.user.login))) continue;
              avis.set(review.user.login, review.state);
            }
            const avisEn = (etat) => [...avis].filter(([, e]) => e === etat).map(([login]) => login);
            const bloquent = avisEn('CHANGES_REQUESTED');
            const approuvent = avisEn('APPROVED');

            if (bloquent.length > 0) {
              core.setFailed(`Modifications demandées par ${bloquent.join(', ')}`);
            } else if (approuvent.length === 0) {
              core.setFailed("En attente de l'approbation d'un autre membre de l'équipe");
            } else {
              core.info(`Approuvée par ${approuvent.join(', ')}`);
            }
