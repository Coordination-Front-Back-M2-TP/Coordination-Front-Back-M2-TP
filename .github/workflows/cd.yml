name: Déploiement continu

# Notre flow (docs/strategie-de-branches.md) : chaque merge sur main part en production,
# une fois la CI de main verte. Les images sont publiées sur GHCR avec les tags sha-<commit> et latest.
# GitHub ne joint jamais le NAS : Watchtower y tire l'image latest (docs/deploiement.md).
# Mode d'emploi et configuration : docs/deploiement.md.

on:
  workflow_run:
    workflows: ['Intégration continue']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  production:
    name: Publier les images (production)
    # Seulement la CI verte d'un push sur main de ce dépôt. Le filtre « branches » ci-dessus lit le nom
    # de la branche d'origine : sans ces conditions, la CI d'une PR de fork dont la branche s'appelle main passerait.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    # Une seule publication à la fois. Celle en cours va au bout, la plus récente attend.
    concurrency:
      group: deploiement-production-${{ matrix.partie }}
      cancel-in-progress: false
    strategy:
      matrix:
        partie: [front, back]
    env:
      # Le commit testé par la CI. github.sha désignerait le dernier commit de main, pas forcément celui-là.
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - name: Nom de l'image
        # GHCR n'accepte que des minuscules, et le nom de l'organisation en contient des majuscules.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/p1x3l-${{ matrix.partie }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Construire et publier
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.partie }}
          push: true
          # sha-<commit> désigne exactement ce commit : il sert au retour arrière.
          tags: ${{ env.IMAGE }}:sha-${{ env.COMMIT }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          build-args: APP_VERSION=${{ env.COMMIT }}
          cache-from: type=gha,scope=${{ matrix.partie }}
          cache-to: type=gha,mode=max,scope=${{ matrix.partie }}

      - name: Mettre en production (latest)
        # Deux merges rapprochés : la CI du plus ancien peut finir en dernier. latest ne reçoit que
        # le dernier commit de main, pour que la production ne recule jamais.
        run: |
          tete=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$tete" != "$COMMIT" ]]; then
            echo "Un commit plus récent est sur main ($tete) : latest l'attend." >> "$GITHUB_STEP_SUMMARY"
            echo "Image publiée : \`$IMAGE:sha-$COMMIT\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:sha-$COMMIT"
          echo "Image de production : \`$IMAGE:sha-$COMMIT\` (aussi \`$IMAGE:latest\`)." >> "$GITHUB_STEP_SUMMARY"
