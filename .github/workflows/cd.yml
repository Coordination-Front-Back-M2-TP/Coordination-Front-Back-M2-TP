name: Déploiement continu

# Notre flow (docs/strategie-de-branches.md) : chaque merge sur main publie des images sur GHCR (staging),
# un tag vX.Y.Z posé sur un commit déjà publié donne ces mêmes images à la production.
# GitHub ne joint jamais le NAS : les images y sont tirées à la main (docs/deploiement.md).
# Mode d'emploi et configuration : docs/deploiement.md.

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  staging:
    name: Publier les images (staging)
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    # Une seule publication à la fois. Celle en cours va au bout, la plus récente attend.
    concurrency:
      group: deploiement-staging
      cancel-in-progress: false
    strategy:
      matrix:
        partie: [front, back]
    steps:
      - uses: actions/checkout@v7

      - name: Nom de l'image
        # GHCR n'accepte que des minuscules, et le nom de l'organisation en contient des majuscules.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/p1x3l-${{ matrix.partie }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Construire et publier
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.partie }}
          push: true
          # sha-<commit> désigne exactement ce commit, staging suit le dernier commit publié.
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:staging
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.partie }}
          cache-to: type=gha,mode=max,scope=${{ matrix.partie }}

      - name: Résumé
        run: |
          echo "Image publiée : \`$IMAGE:sha-$GITHUB_SHA\` (aussi \`$IMAGE:staging\`)." >> "$GITHUB_STEP_SUMMARY"

  verifier:
    name: Vérifier la version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Le tag suit semver
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::« $TAG » n'est pas une version vMAJEUR.MINEUR.CORRECTIF (semver)."
            exit 1
          fi

      - name: Le commit est sur main ou sur une branche release/
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE '^\s*origin/(main|release/.+)$'; then
            echo "::error::Le tag $TAG ne pointe pas sur un commit de main ni d'une branche release/X.Y."
            exit 1
          fi

      - name: Le commit a été publié en staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deploiements=$(gh run list --workflow cd.yml --commit "$GITHUB_SHA" --event push --status success \
            --json headBranch --jq '[.[] | select(.headBranch == "main" or (.headBranch | startswith("release/")))] | length')
          if [[ "$deploiements" == 0 ]]; then
            echo "::error::Le commit $GITHUB_SHA n'a pas encore été publié en staging. Attendre la fin de « Publier les images (staging) », puis relancer ce workflow."
            exit 1
          fi

  production:
    name: Publier les images (production)
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    strategy:
      matrix:
        partie: [front, back]
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/p1x3l-${{ matrix.partie }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Étiqueter l'image de staging
        # Pas de reconstruction : la production reçoit l'image exacte qui a tourné en staging.
        # Relancer le workflow d'un ancien tag remet latest sur cette version (retour arrière).
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            "$IMAGE:sha-$GITHUB_SHA"
          echo "Image de production : \`$IMAGE:$TAG\` (aussi \`$IMAGE:latest\`)." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publier la release GitHub
    needs: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Créer la release avec les notes générées
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Relancer le workflow d'un ancien tag le redéploie (retour arrière) : la release existe déjà.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "La release $TAG existe déjà : rien à publier."
            exit 0
          fi
          options=(--verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$TAG" "${options[@]}"
