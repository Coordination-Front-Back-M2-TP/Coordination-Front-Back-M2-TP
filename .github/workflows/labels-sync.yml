name: Synchroniser les labels

on:
  push:
    branches: [main]
    paths: ['.github/labels.yml', '.github/workflows/labels-sync.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    name: Appliquer .github/labels.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crazy-max/ghaction-github-labeler@v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
