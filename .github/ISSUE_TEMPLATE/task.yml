name: Tâche
description: Un travail technique concret, rattaché à une user story
title: "[Tâche] "
labels: ["type: tâche"]
body:
  - type: input
    id: us-parent
    attributes:
      label: User story parente
      description: Numéro de la user story (par exemple `#12`).
    validations:
      required: true
  - type: dropdown
    id: zone
    attributes:
      label: Zone
      description: Pose automatiquement le label de zone.
      options:
        - Front
        - Back
        - Transverse
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Ce qu'il faut faire, concrètement.
    validations:
      required: true
  - type: textarea
    id: fin
    attributes:
      label: Critère de fin
      description: Comment savoir que la tâche est terminée.
    validations:
      required: true
